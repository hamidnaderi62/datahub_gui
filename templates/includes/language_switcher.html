{% load i18n %}

<form action="{% url 'set_language' %}" method="post" class="language-switcher d-flex align-items-center ms-2">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% get_current_language as CURRENT_LANGUAGE %}
    <label class="visually-hidden" for="datahub-language">{{ ui.language }}</label>
    <select id="datahub-language" name="language" class="form-select form-select-sm" onchange="this.form.submit()" aria-label="{{ ui.language }}">
        <option value="fa"{% if CURRENT_LANGUAGE == 'fa' %} selected{% endif %}>فارسی</option>
        <option value="en"{% if CURRENT_LANGUAGE == 'en' %} selected{% endif %}>English</option>
        <option value="ar"{% if CURRENT_LANGUAGE == 'ar' %} selected{% endif %}>العربية</option>
    </select>
</form>
