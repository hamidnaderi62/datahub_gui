{% if page_obj.paginator.num_pages > 1 %}<nav class="ops-pagination" aria-label="Pagination"><span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_previous %}<a href="?q={{ query|urlencode }}{% if selected_status %}&status={{ selected_status|urlencode }}{% endif %}&page={{ page_obj.previous_page_number }}"><i class="ti ti-chevron-left"></i></a>{% endif %}{% if page_obj.has_next %}<a href="?q={{ query|urlencode }}{% if selected_status %}&status={{ selected_status|urlencode }}{% endif %}&page={{ page_obj.next_page_number }}"><i class="ti ti-chevron-right"></i></a>{% endif %}</nav>{% endif %}
